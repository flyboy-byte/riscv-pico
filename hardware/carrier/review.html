<title>BOARD_NAME Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column; questions first (what needs the owner), then pictures, size, stages, checks. */
:root {
  --bg: #f3f5f2;        /* board-shop bench white, slight green bias */
  --panel: #ffffff;
  --fg: #17201b;
  --muted: #5b6a61;
  --line: #d5ddd7;
  --mask: #1f6b45;      /* soldermask green: accent */
  --copper: #b8692e;    /* copper: recommended option, highlights */
  --pass: #2d7d4f; --fail: #b3362f; --skip: #8a7a2b;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101613; --panel: #18201c; --fg: #e4ebe6; --muted: #98a89e; --line: #2c3832;
  --mask: #5cc48b; --copper: #e09a5f; --pass: #5cc48b; --fail: #f07a70; --skip: #d4c060; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101613; --panel: #18201c; --fg: #e4ebe6; --muted: #98a89e; --line: #2c3832;
  --mask: #5cc48b; --copper: #e09a5f; --pass: #5cc48b; --fail: #f07a70; --skip: #d4c060; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
header { display: grid; gap: 6px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 800 clamp(26px, 6vw, 36px)/1.1 var(--display); margin: 0; text-wrap: balance; }
h2 { font: 700 18px/1.2 var(--display); margin: 0 0 10px; letter-spacing: .01em; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
.chip { font: 500 12px/1 var(--mono); padding: 5px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
.chip.rev { border-color: var(--mask); color: var(--mask); }
.next { border-left: 3px solid var(--copper); padding: 10px 14px; background: var(--panel); }
.next b { display: block; font: 600 12px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--copper); }
section { min-width: 0; }
.empty { color: var(--muted); font-style: italic; }

.q { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 10px; }
.qs { display: grid; gap: 12px; }
.q p { margin: 0; }
.q .why { color: var(--muted); font-size: 14px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { font: 500 14px/1.3 var(--body); padding: 9px 12px; border-radius: 5px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); cursor: pointer; text-align: left; }
.opt.rec { border-color: var(--copper); }
.opt.rec::after { content: " · recommended"; font: 400 11px var(--mono); color: var(--copper); }
.opt[aria-pressed="true"] { background: var(--mask); border-color: var(--mask); color: var(--bg); }
.opt[aria-pressed="true"]::after { color: inherit; }
textarea { font: 14px/1.4 var(--body); width: 100%; box-sizing: border-box; min-height: 60px; padding: 8px; border-radius: 5px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.save { font: 600 14px var(--body); padding: 9px 16px; border-radius: 5px; border: 0; background: var(--mask); color: var(--bg); cursor: pointer; }
.save:disabled { opacity: .5; cursor: default; }
.status { font-size: 13px; color: var(--muted); }
.answered { font: 500 13px var(--mono); color: var(--pass); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }

.pics { display: grid; gap: 14px; }
figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
figure img { display: block; width: 100%; height: auto; background: #fff; }
figcaption { padding: 10px 12px; font-size: 14px; }
figcaption small { display: block; color: var(--muted); font: 12px var(--mono); margin-top: 2px; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 12px var(--mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
td.num { font: 14px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.src { font: 12px var(--mono); color: var(--muted); }
.pill { font: 600 11px/1 var(--mono); padding: 4px 6px; border-radius: 3px; letter-spacing: .05em; white-space: nowrap; }
.pill.pass { color: var(--pass); border: 1px solid var(--pass); }
.pill.fail { color: var(--fail); border: 1px solid var(--fail); }
.pill.skipped { color: var(--skip); border: 1px solid var(--skip); }
.stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.stages li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.stages .n { font: 500 13px var(--mono); color: var(--muted); }
.stages .done .n { color: var(--pass); }
.stages .cur { background: color-mix(in srgb, var(--copper) 10%, transparent); }
.stages .cur .n { color: var(--copper); }
.stages strong { font-weight: 600; }
.stages span.ex { display: block; color: var(--muted); font-size: 13px; }
.stages span.st { display: block; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Board review</div>
    <h1 id="name">Loading the board…</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="next" id="next" hidden><b>Next step</b><span id="nextText"></span></div>

  <section aria-labelledby="hq">
    <h2 id="hq">Questions for you</h2>
    <div class="qs" id="questions"><p class="empty">No open questions. When Claude needs a decision it appears here.</p></div>
  </section>

  <section aria-labelledby="hp">
    <h2 id="hp">Pictures</h2>
    <div class="pics" id="pictures"><p class="empty">Fit-check drawings and renders appear here once Claude exports them.</p></div>
  </section>

  <section aria-labelledby="hs" id="sizeSec" hidden>
    <h2 id="hs">Size</h2>
    <div class="scroll"><table><thead><tr><th>What</th><th>mm</th><th>in</th><th>Source</th></tr></thead><tbody id="size"></tbody></table></div>
  </section>

  <section aria-labelledby="hst" id="stageSec" hidden>
    <h2 id="hst">Stages</h2>
    <ol class="stages" id="stages"></ol>
  </section>

  <section aria-labelledby="hc" id="checkSec" hidden>
    <h2 id="hc">Checks</h2>
    <div class="scroll"><table><thead><tr><th>Check</th><th>Result</th><th>Summary</th></tr></thead><tbody id="checks"></tbody></table></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; }
const fmt = v => (typeof v === 'number' ? v.toFixed(2) : (v ?? ''));

function renderSummary(d) {
  if (!d) { $('name').textContent = 'No board data yet'; $('meta').replaceChildren(el('span', 'empty', 'Claude fills this page from the project’s STATE.md.')); return; }
  $('name').textContent = d.name || 'Unnamed board';
  document.title = (d.name || 'Board') + ' Review';
  const meta = [];
  if (d.revision) meta.push(el('span', 'chip rev', d.revision));
  if (d.stage) meta.push(el('span', 'chip', d.stage));
  if (d.status) meta.push(el('span', null, d.status));
  if (d.updated) meta.push(el('span', 'src', 'updated ' + d.updated));
  $('meta').replaceChildren(...meta);
  $('next').hidden = !d.next; $('nextText').textContent = d.next || '';

  const size = Array.isArray(d.size) ? d.size : [];
  $('sizeSec').hidden = !size.length;
  $('size').replaceChildren(...size.map(s => { const tr = el('tr');
    tr.append(el('td', null, s.what), el('td', 'num', fmt(s.mm)), el('td', 'num', typeof s.mm === 'number' ? (s.mm / 25.4).toFixed(2) : ''), el('td', 'src', s.source)); return tr; }));

  const stages = Array.isArray(d.stages) ? d.stages : [];
  $('stageSec').hidden = !stages.length;
  $('stages').replaceChildren(...stages.map(s => { const li = el('li', s.done ? 'done' : (s.current ? 'cur' : ''));
    li.append(el('span', 'n', s.done ? '✓' : s.n)); const b = el('div'); b.append(el('strong', null, s.name), el('span', 'ex', s.exit));
    if (s.note) b.append(el('span', 'st', s.note)); li.append(b); return li; }));

  const checks = Array.isArray(d.checks) ? d.checks : [];
  $('checkSec').hidden = !checks.length;
  $('checks').replaceChildren(...checks.map(c => { const tr = el('tr'); const st = String(c.status || '').toLowerCase();
    const td = el('td'); td.append(el('span', 'pill ' + st, st.toUpperCase()));
    tr.append(el('td', null, c.name), td, el('td', null, c.summary)); return tr; }));
}

function renderPictures(docs) {
  if (!docs.length) return;
  $('pictures').replaceChildren(...docs.map(s => { const p = s.data(); const f = el('figure');
    if (p.url) { const img = el('img'); img.src = p.url; img.alt = p.caption || 'Board picture'; img.loading = 'lazy'; f.append(img); }
    const cap = el('figcaption', null, p.caption || ''); if (p.note) cap.append(el('small', null, p.note)); f.append(cap); return f; }));
}

let db = null, me = null, canAnswer = false;
const drafts = {};   // question id -> {answer, note} the viewer hasn't saved yet

function renderQuestions(docs) {
  const open = docs.filter(s => !s.data().closed);
  if (!open.length) { $('questions').replaceChildren(el('p', 'empty', 'No open questions. When Claude needs a decision it appears here.')); return; }
  $('questions').replaceChildren(...open.map(s => {
    const q = s.data(), id = s.id, draft = drafts[id] || (drafts[id] = { answer: q.answer || '', note: q.note || '' });
    const box = el('div', 'q');
    box.append(el('p', null, q.text));
    if (q.why) box.append(el('p', 'why', q.why));
    const opts = el('div', 'opts');
    (Array.isArray(q.options) ? q.options : []).forEach(o => {
      const b = el('button', 'opt' + (o === q.recommended ? ' rec' : ''), o); b.type = 'button';
      b.setAttribute('aria-pressed', String(draft.answer === o)); b.disabled = !canAnswer;
      b.onclick = () => { draft.answer = o; opts.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', String(x.textContent === o))); save.disabled = false; };
      opts.append(b); });
    box.append(opts);
    const ta = el('textarea'); ta.id = 'note-' + id; ta.placeholder = 'Anything to add (optional)'; ta.value = draft.note; ta.disabled = !canAnswer;
    ta.oninput = () => { draft.note = ta.value; save.disabled = false; };
    box.append(ta);
    const row = el('div', 'row'), save = el('button', 'save', q.answer ? 'Update answer' : 'Save answer'), st = el('span', 'status');
    save.type = 'button'; save.disabled = true;
    if (q.answer) st.replaceChildren(el('span', 'answered', 'Answered: ' + q.answer));
    if (!canAnswer) st.textContent = 'You can read this page but not answer here.';
    save.onclick = async () => {
      if (!draft.answer && !draft.note.trim()) { st.textContent = 'Pick an option or write a note first.'; return; }
      save.disabled = true; st.textContent = 'Saving…';
      try {
        await db.doc('questions/' + id).update({ answer: draft.answer, note: draft.note.trim(), answeredAt: new Date().toISOString(), answeredBy: me });
        st.textContent = 'Saved. Claude reads it next session.';
      } catch (e) { save.disabled = false; st.textContent = e && e.code === 'permission_denied' ? 'You don’t have permission to answer on this page.' : 'Not saved: ' + ((e && e.message) || 'try again'); }
    };
    row.append(save, st); box.append(row);
    return box; }));
}

(async () => {
  db = await claude.use('db');
  if (!db) { $('name').textContent = 'Board review'; $('meta').replaceChildren(el('span', 'empty', 'Open this page signed in to claude.ai to see the board data.')); return; }
  const user = await claude.use('user');
  me = user ? await user.id() : null;
  canAnswer = user ? (await user.can('data.write')) !== false : false;
  db.doc('board/summary').onSnapshot(s => renderSummary(s.exists ? s.data() : null), () => renderSummary(null));
  db.collection('pictures').orderBy('order').onSnapshot(q => renderPictures(q.docs));
  db.collection('questions').orderBy('order').onSnapshot(q => renderQuestions(q.docs));
})();
</script>
